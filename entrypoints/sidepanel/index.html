<!doctype html>
<!-- Side panel UI: output scrolls above, the /command input sits at the bottom. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Browser Agent</title>
    <style>
      body { margin: 0; height: 100vh; display: flex; flex-direction: column; font: 13px ui-monospace, Consolas, monospace; }
      #out { flex: 1; overflow-y: auto; padding: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .error { color: #c62828; }
      .stop { color: #8a4b00; font-weight: bold; }
      .ask button, .tips button { font: inherit; margin: 4px 8px 4px 0; padding: 4px 10px; cursor: pointer; }
      .ask textarea { display: block; box-sizing: border-box; width: 100%; margin-top: 4px; font: inherit; resize: vertical; }
      .ask textarea[readonly] { background: #f5f5f5; }
      form { border-top: 1px solid #ccc; }
      input { box-sizing: border-box; width: 100%; padding: 8px; border: 0; font: inherit; }
    </style>
  </head>
  <body>
    <div id="out" role="log"></div>
    <form>
      <input aria-label="A /command" placeholder="/command · /help for the list" autocomplete="off" spellcheck="false" autofocus />
    </form>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
